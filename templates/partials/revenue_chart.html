{% load static %}

<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-sm mb-6" x-data="revenueChartComponent()"
    x-init="initChart()">

    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
        <div class="flex items-center gap-3">
            <div
                class="w-8 h-8 rounded-lg bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
                <i class="fa-solid fa-chart-line text-sm"></i>
            </div>
            <div>
                <h2 class="text-sm font-bold text-white">Revenue Analytics</h2>
                <p class="text-xs text-slate-400">Track delivered order earnings over the past 7 days</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span
                class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                Last 7 Days
            </span>
        </div>
    </div>

    <!-- Chart Canvas Container -->
    <div class="relative h-72 w-full">
        <canvas id="revenueChart"></canvas>
    </div>

</div>

<script>
    function revenueChartComponent() {
        return {
            chart: null,
            activeRange: 7,
            startDate: '',
            endDate: '',

            initChart() {
                this.setRange(7);
            },

            setRange(days) {
                this.activeRange = days;
                const end = new Date();
                const start = new Date();
                start.setDate(end.getDate() - (days - 1));

                this.startDate = start.toISOString().split('T')[0];
                this.endDate = end.toISOString().split('T')[0];

                this.fetchChartData();
            },

            fetchChartData() {
                fetch(`/api/v1/revenue-chart/?start_date=${this.startDate}&end_date=${this.endDate}`)
                    .then(response => {
                        if (!response.ok) throw new Error("HTTP error " + response.status);
                        return response.json();
                    })
                    .then(data => {
                        this.renderChart(data.labels, data.data);
                    })
                    .catch(err => console.error("Error fetching revenue chart data:", err));
            },

            renderChart(labels, dataValues) {
                const canvas = document.getElementById('revenueChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                if (this.chart) {
                    this.chart.destroy();
                }

                this.chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Revenue (BDT)',
                            data: dataValues,
                            borderColor: '#6366f1',
                            backgroundColor: 'rgba(99, 102, 241, 0.12)',
                            fill: true,
                            tension: 0.35,
                            borderWidth: 2.5,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            pointBackgroundColor: '#6366f1',
                            pointBorderColor: '#0f172a',
                            pointBorderWidth: 2,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#0f172a',
                                titleColor: '#f8fafc',
                                bodyColor: '#c7d2fe',
                                borderColor: '#334155',
                                borderWidth: 1,
                                padding: 10,
                                callbacks: {
                                    label: function (c) {
                                        return ' Revenue: BDT ' + Number(c.raw).toLocaleString();
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                ticks: { color: '#94a3b8', font: { size: 11 } }
                            },
                            y: {
                                beginAtZero: true,
                                grid: { color: 'rgba(51, 65, 85, 0.35)' },
                                ticks: {
                                    color: '#94a3b8',
                                    font: { size: 11 },
                                    callback: function (value) {
                                        return 'BDT ' + value;
                                    }
                                }
                            }
                        }
                    }
                });
            }
        };
    }
</script>
