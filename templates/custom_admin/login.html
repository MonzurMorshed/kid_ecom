<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Kidurabd</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 font-['Inter'] text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-8 shadow-2xl">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-sky-500/10 text-sky-400 rounded-xl mb-3 border border-sky-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Kidurabd Admin</h1>
            <p class="text-sm text-slate-400 mt-1">Sign in to access the control panel</p>
        </div>

        <!-- Alert Messages with Alpine.js dismiss feature -->
        {% if messages %}
        <div class="space-y-3 mb-6">
            {% for message in messages %}
            <div x-data="{ show: true }" x-show="show" x-transition 
                 class="flex items-center justify-between p-4 rounded-xl text-sm font-medium border
                 {% if message.tags == 'error' %} bg-rose-500/10 border-rose-500/30 text-rose-300
                 {% elif message.tags == 'success' %} bg-emerald-500/10 border-emerald-500/30 text-emerald-300
                 {% else %} bg-sky-500/10 border-sky-500/30 text-sky-300 {% endif %}">
                <span>{{ message }}</span>
                <button @click="show = false" type="button" class="ml-3 text-slate-400 hover:text-white transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Form -->
        <form method="POST" action="{% url 'custom_admin:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" class="space-y-5">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Username</label>
                <input type="text" name="username" id="username" required autofocus 
                       placeholder="Enter your username"
                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Password</label>
                <input type="password" name="password" id="password" required 
                       placeholder="Enter your password"
                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
            </div>

            <button type="submit" 
                    class="w-full py-3.5 px-4 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-xl shadow-lg shadow-sky-600/25 active:scale-[0.99] transition duration-200">
                Sign In
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-8 text-center text-sm text-slate-400">
            Need an admin account? 
            <a href="{% url 'custom_admin:register' %}" class="text-sky-400 font-medium hover:underline">Register here</a>
        </div>
    </div>

</body>
</html>
