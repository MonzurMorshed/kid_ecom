{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Kidurabd</title>
    <!-- Tailwind CSS Local Asset -->
    <script src="{% static 'vendor/tailwindcss/tailwind.js' %}"></script>
    <!-- Alpine.js Local Asset -->
    <script defer src="{% static 'vendor/alpinejs/alpine.min.js' %}"></script>
    <!-- Local Fonts -->
    <link rel="stylesheet" href="{% static 'vendor/fonts/inter.css' %}">
    <!-- Font Awesome Local Asset -->
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
</head>
<body class="bg-slate-950 font-['Inter'] text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-8 shadow-2xl">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-sky-500/10 text-sky-400 rounded-xl mb-3 border border-sky-500/20 text-lg">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Kidurabd Admin</h1>
            <p class="text-sm text-slate-400 mt-1">Sign in to access the control panel</p>
        </div>

        <!-- Alert Messages with Alpine.js dismiss feature -->
        {% if messages %}
        <div class="space-y-3 mb-6">
            {% for message in messages %}
            <div x-data="{ show: true }" x-show="show" x-transition 
                 class="flex items-center justify-between p-4 rounded-xl text-sm font-medium border
                 {% if message.tags == 'error' %} bg-rose-500/10 border-rose-500/30 text-rose-300
                 {% elif message.tags == 'success' %} bg-emerald-500/10 border-emerald-500/30 text-emerald-300
                 {% else %} bg-sky-500/10 border-sky-500/30 text-sky-300 {% endif %}">
                 <span>{{ message }}</span>
                <button @click="show = false" type="button" class="ml-3 text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Form -->
        <form method="POST" action="{% url 'custom_admin:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" class="space-y-5">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Username</label>
                <input type="text" name="username" id="username" required autofocus 
                       placeholder="Enter your username"
                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">Password</label>
                    <a href="{% url 'custom_admin:forgot_password' %}" class="text-xs text-sky-400 hover:text-sky-300 transition">Forgot password?</a>
                </div>
                <input type="password" name="password" id="password" required
                       placeholder="Enter your password"
                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
            </div>

            <button type="submit"
                    class="w-full py-3.5 px-4 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-xl shadow-lg shadow-sky-600/25 active:scale-[0.99] transition duration-200 flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <span>Sign In</span>
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-8 text-center text-sm text-slate-400">
            Need an admin account? 
            <a href="{% url 'custom_admin:register' %}" class="text-sky-400 font-medium hover:underline">Register here</a>
        </div>
    </div>

</body>
</html>
