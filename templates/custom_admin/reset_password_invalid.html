<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Reset Link - Kidurabd Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 font-['Inter'] text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-10 shadow-2xl text-center">

            <!-- Icon -->
            <div class="inline-flex items-center justify-center w-14 h-14 bg-rose-500/10 text-rose-400 rounded-2xl mb-5 border border-rose-500/20 text-2xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>

            <h1 class="text-2xl font-bold text-white mb-2">Link Expired or Invalid</h1>
            <p class="text-sm text-slate-400 mb-6">
                This password reset link is no longer valid. Reset links expire after
                <strong class="text-slate-300">1 hour</strong> and can only be used once.
            </p>

            <div class="space-y-3">
                <a href="{% url 'custom_admin:forgot_password' %}"
                   class="flex items-center justify-center gap-2 w-full py-3 px-4 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-xl transition">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>Request a New Reset Link</span>
                </a>
                <a href="{% url 'custom_admin:login' %}"
                   class="flex items-center justify-center gap-2 w-full py-3 px-4 bg-slate-800 border border-slate-700 text-slate-300 hover:text-white font-medium rounded-xl transition text-sm">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                    <span>Back to Login</span>
                </a>
            </div>

        </div>
    </div>

</body>
</html>
