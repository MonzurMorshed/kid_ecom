{% extends "base.html" %}

{% block title %}Invalid Reset Link — Kidurabd{% endblock %}

{% block content %}
<section class="min-h-[calc(100vh-72px)] flex items-center justify-center py-12 px-4">
<div class="w-full max-w-md text-center">
    <div class="bg-white rounded-3xl shadow-toy border border-ink/5 p-10">
        <div class="w-16 h-16 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center text-3xl mx-auto mb-5">
            <i class="fa-solid fa-hourglass-end"></i>
        </div>
        <h1 class="text-2xl font-bold text-ink mb-2">Link expired or invalid</h1>
        <p class="text-sm text-ink/50 mb-7 leading-relaxed">
            This password reset link has already been used or has expired.<br>
            Please request a new one.
        </p>
        <a href="{% url 'accounts:forgot_password' %}"
           class="inline-flex items-center gap-2 rounded-2xl bg-coral px-7 py-3.5 text-sm font-bold text-white shadow-button hover:bg-coral/90 transition-all active:translate-y-1">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Request New Link</span>
        </a>
        <div class="mt-4">
            <a href="{% url 'accounts:login' %}" class="inline-flex items-center gap-1.5 text-sm text-ink/40 hover:text-coral transition">
                <i class="fa-solid fa-arrow-left text-xs"></i>
                <span>Back to Sign In</span>
            </a>
        </div>
    </div>
</div>
</section>
{% endblock %}
