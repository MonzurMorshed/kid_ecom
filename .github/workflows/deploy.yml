name: Deploy KiduraBD to Namecheap cPanel

on:
  push:
    branches:
      - main
      - morshed
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Namecheap Stellar Plus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute deployment via SSH on Namecheap
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 21098 }}
          script: |
            echo "🚀 Starting Deployment on Namecheap..."
            
            PROJECT_DIR="/home/${{ secrets.CPANEL_USER }}/kid_ecom"

            # 1. Check if project directory exists, if not, clone it automatically
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "⚠️ Project directory not found at $PROJECT_DIR."
              echo "📥 Auto-cloning repository for the first time..."
              cd /home/${{ secrets.CPANEL_USER }}
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git kid_ecom
            fi
            
            cd "$PROJECT_DIR" || { echo "❌ Failed to enter $PROJECT_DIR"; exit 1; }
            
            # 2. Pull latest changes from git
            echo "📥 Fetching and syncing latest git changes for branch: ${{ github.ref_name }}..."
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            # 3. Check for .env file
            if [ ! -f ".env" ]; then
              echo "⚠️ .env file does not exist yet. Creating placeholder from .env.production.example..."
              cp .env.production.example .env
              echo "🔔 IMPORTANT: Remember to update DB credentials in $PROJECT_DIR/.env via cPanel File Manager!"
            fi

            # 4. Locate and activate Python virtualenv
            VENV_ACTIVATE=$(find /home/${{ secrets.CPANEL_USER }}/virtualenv -name activate 2>/dev/null | grep -i "kid_ecom" | head -n 1)
            if [ -z "$VENV_ACTIVATE" ]; then
              # Fallback to any virtualenv under user home
              VENV_ACTIVATE=$(find /home/${{ secrets.CPANEL_USER }}/virtualenv -name activate 2>/dev/null | head -n 1)
            fi

            if [ -n "$VENV_ACTIVATE" ]; then
              echo "🐍 Activating virtual environment: $VENV_ACTIVATE"
              source "$VENV_ACTIVATE"
            else
              echo "⚠️ Virtualenv not found! Make sure you created the Python App in cPanel 'Setup Python App'."
              echo "Continuing with system Python if available..."
            fi
            
            # 5. Install / update dependencies
            echo "📦 Installing requirements..."
            pip install --no-cache-dir -r requirements.txt
            
            # 6. Run database migrations (only if DB is configured)
            echo "🗄️ Running migrations..."
            python manage.py migrate --noinput || echo "⚠️ Migration skipped (check DB credentials in .env)"
            
            # 7. Collect static files
            echo "🎨 Collecting static files..."
            python manage.py collectstatic --noinput
            
            # 8. Restart CloudLinux Phusion Passenger
            echo "🔄 Restarting Django Passenger Application..."
            mkdir -p tmp
            touch tmp/restart.txt
            
            echo "✅ Deployment completed successfully!"
